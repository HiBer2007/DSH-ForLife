# DSH-ForLife profile 的用户补丁层（在 bundle 层之后应用）。
#
# 两条规则（来自对宿主实现的调研）：
#   1. `- id:` 定向 patch 会**替换整行 config**，不是合并 ⇒ 每个键都必须重述；
#   2. 行顺序不决定加载顺序（由服务可用性驱动），只决定 patch 应用顺序。

# 我们的组件：forlife-memory 由它自己的 bundle 补丁注册，这里覆盖配置。
- id: forlife-memory
  name: forlife-memory
  config:
    # 全部路径相对 DSH_HOME，保证可移植（换机器只改 DSH_HOME）
    storageRoots:
      db: ./forlife/db
      hot: ./forlife/hot
      warm: ./forlife/warm
      cold: ./forlife/cold
      vectors: ./forlife/vectors
      workspace: ./forlife/workspace
      models: ./forlife/models
      tmp: ./forlife/tmp
      logs: ./forlife/logs
    time:
      systemZone: UTC
    wake:
      enabled: false

# 显式挂载宿主时钟插件：它默认只存在于 web bundle 且 disabled:true，
# 不显式挂就完全拿不到时间上下文（EXECUTION_PLAN §2.15 的根因 R1）。
# refreshIntervalMs: 0 = 每个合格步骤都注入；后续由我们自己的事件驱动注入节流接管。
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
        refreshIntervalMs: 0

# 压缩引擎：禁用宿主的 compaction-basic，挂我们的结构化压缩实现。
# 为什么必须替换而不是并存：`ctx.compaction` 是**单实现**服务
# （CompactionEngine 基类构造函数里 super(ctx, "compaction")），两个实现会互相覆盖。
- id: compaction-basic
  disabled: true

- insert:
    - id: forlife-compaction
      name: 'forlife-memory/compaction'

# ── OpenCode Go（本项目实际使用的模型接入）──────────────────────────────
#
# **为什么必须显式声明**：DSH 默认走内置的 `deepseek-official`，它要
# `DEEPSEEK_API_KEY` —— 而本项目走 OpenCode Go。不声明的话，
# 就算设了 `FORLIFE_OPENCODE_GO_KEY`，DSH 也不知道有这个 provider，
# 真机表现是：`MISSING_CREDENTIAL: no API key for provider route "deepseek-official"`。
#
# **为什么是"改 config"而不是"insert 一份"**：
# `@deepseek-ai/dsh-llm-pi-ai` 已经在 base bundle 里挂着了 ——
# 再 insert 一份会报 `configurable provider "amazon-bedrock" is already declared`
# （两个实例抢同一批 provider 声明）。所以按 id 定位、只改 config。
#
# `apiKeyEnv` 是**凭据引用名**（值仍在环境变量里）—— 与"密钥只存引用名"一致。
# `baseURL` 与 gateway 侧的 `OPENCODE_GO_BASE_URL` 必须一致，
# 否则面板上的额度统计与实际调用会对不上。
- id: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: FORLIFE_OPENCODE_GO_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        # 只列**授权过的**模型（PLAN 里那 5 个）。
        # 列全 43 个的话，模型可能在选择器里挑到未授权/未验证的那些。
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 262144
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 262144
          - id: glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 204800
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 204800

# 默认模型：**必须一起改** —— 只加 provider 的话，新 agent 仍用内置的
# `deepseek-official`（要 DEEPSEEK_API_KEY），真机表现就是那条 MISSING_CREDENTIAL。
# 推理强度按项目规定：deepseek-v4.1-flash 支持 none|low|high|max（**没有 medium**）。
- id: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high
