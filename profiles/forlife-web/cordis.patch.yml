# DSH Web + ForLife 组件。
# 规则同前：`- id:` 定向 patch 会替换整行 config，每个键都要重述。

- id: forlife-memory
  name: forlife-memory
  config:
    storageRoot: ./forlife
    relativeAges: true
    verbose: true

# 时钟插件：web bundle 里它默认 disabled:true，不显式挂就拿不到时间上下文。
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
        refreshIntervalMs: 0

# 面板接口插件：单独的插件行（它 inject: ['connection']，而该服务只由 dsh-web-app 提供，
# 所以只能在 web profile 里挂 —— 见 packages/dsh-component/src/panel-plugin.ts 的说明）。
- insert:
    - id: forlife-memory-panel
      name: 'forlife-memory/panel'

# 压缩引擎：禁用宿主的 compaction-basic，挂我们的结构化压缩实现。
# 为什么必须替换而不是并存：`ctx.compaction` 是**单实现**服务
# （CompactionEngine 基类构造函数里 super(ctx, "compaction")），两个实现会互相覆盖。
- id: compaction-basic
  disabled: true

- insert:
    - id: forlife-compaction
      name: 'forlife-memory/compaction'
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1

# ── OpenCode Go（本项目实际使用的模型接入）──────────────────────────────
#
# **为什么必须显式声明**：DSH 默认走内置的 `deepseek-official`，它要
# `DEEPSEEK_API_KEY` —— 而本项目走 OpenCode Go。不声明的话，
# 就算设了 `FORLIFE_OPENCODE_GO_KEY`，DSH 也不知道有这个 provider，
# 真机表现是：`MISSING_CREDENTIAL: no API key for provider route "deepseek-official"`。
#
# **为什么是"改 config"而不是"insert 一份"**：
# `@deepseek-ai/dsh-llm-pi-ai` 已经在 base bundle 里挂着了 ——
# 再 insert 一份会报 `configurable provider "amazon-bedrock" is already declared`
# （两个实例抢同一批 provider 声明）。所以按 id 定位、只改 config。
#
# `apiKeyEnv` 是**凭据引用名**（值仍在环境变量里）—— 与"密钥只存引用名"一致。
# `baseURL` 与 gateway 侧的 `OPENCODE_GO_BASE_URL` 必须一致，
# 否则面板上的额度统计与实际调用会对不上。
# ★ 2026-10-08 修：这里**必须是 base bundle 里的短 id**，不是包名。
#   base 的结构是 `id: <短名>` + `name: <包名>`；
#   拿包名当 id 去定位会**静默丢弃整段 patch**（只在 `--dump-config` 时打一行警告）。
- id: llm-pi-ai
  config:
    providers:
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: FORLIFE_OPENCODE_GO_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/go/v1
        # **OpenCode Go 强制要求**：每个请求带 `x-opencode-session`。
        # 不带的话真机报 400 MissingSessionID —— 它是**路由与提示词缓存**的依据，
        # 不是可选元数据。id 要**稳定**（变了会掉缓存）。
        headers:
          x-opencode-session: dsh-forlife
        # 只列**授权过的**模型（PLAN 里那 5 个）。
        # 列全 43 个的话，模型可能在选择器里挑到未授权/未验证的那些。
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 262144
            # **档位必须显式声明** —— 不声明时宿主认为"不支持任何档位"，
            # 真机报错：does not support reasoning effort "high"。
            # 按项目规定（**没有 medium**）：none | low | high | max
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 262144
            # **档位必须显式声明** —— 不声明时宿主认为"不支持任何档位"，
            # 真机报错：does not support reasoning effort "high"。
            # 按项目规定（**没有 medium**）：none | low | high | max
            reasoningEfforts:
              off:
              low: low
              high: high
              max: max
          - id: glm-5.3-flash
            name: GLM 5.3 Flash
            contextWindow: 204800
            # **档位必须显式声明** —— 不声明时宿主认为"不支持任何档位"，
            # 真机报错：does not support reasoning effort "high"。
            # 按项目规定（**没有 medium**）：low | high | max
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: glm-5.3
            name: GLM 5.3
            contextWindow: 204800
            # **档位必须显式声明** —— 不声明时宿主认为"不支持任何档位"，
            # 真机报错：does not support reasoning effort "high"。
            # 按项目规定（**没有 medium**）：low | high | max
            reasoningEfforts:
              low: low
              high: high
              max: max

# 默认模型：**必须一起改** —— 只加 provider 的话，新 agent 仍用内置的
# `deepseek-official`（要 DEEPSEEK_API_KEY），真机表现就是那条 MISSING_CREDENTIAL。
# 推理强度按项目规定：deepseek-v4.1-flash 支持 none|low|high|max（**没有 medium**）。
# ★ 2026-10-08 修：这里**必须是 base bundle 里的短 id**，不是包名。
#   base 的结构是 `id: <短名>` + `name: <包名>`；
#   拿包名当 id 去定位会**静默丢弃整段 patch**（只在 `--dump-config` 时打一行警告）。
- id: agent-default-model
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    reasoningEffort: high
