# DSH Web + ForLife 组件。
# 规则同前：`- id:` 定向 patch 会替换整行 config，每个键都要重述。

- id: forlife-memory
  name: forlife-memory
  config:
    storageRoot: ./forlife
    relativeAges: true
    verbose: true

# 时钟插件：web bundle 里它默认 disabled:true，不显式挂就拿不到时间上下文。
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        timeZone: Asia/Shanghai
        refreshIntervalMs: 0

# 面板接口插件：单独的插件行（它 inject: ['connection']，而该服务只由 dsh-web-app 提供，
# 所以只能在 web profile 里挂 —— 见 packages/dsh-component/src/panel-plugin.ts 的说明）。
- insert:
    - id: forlife-memory-panel
      name: 'forlife-memory/panel'

# 压缩引擎：禁用宿主的 compaction-basic，挂我们的结构化压缩实现。
# 为什么必须替换而不是并存：`ctx.compaction` 是**单实现**服务
# （CompactionEngine 基类构造函数里 super(ctx, "compaction")），两个实现会互相覆盖。
- id: compaction-basic
  disabled: true

- insert:
    - id: forlife-compaction
      name: 'forlife-memory/compaction'
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
