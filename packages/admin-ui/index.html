<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 手机端：状态栏配色跟随主题，避免深色下出现白条 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
    <meta name="color-scheme" content="light dark" />
        <link rel="icon" href="./favicon.ico" />
    <title>DSH-ForLife 控制台</title>
    <!--
      主题必须在首屏之前定下来，否则会闪一下白（FOUC）。
      它**必须是独立文件**：面板用严格 CSP（script-src 'self'），内联脚本会逼我们放开
      'unsafe-inline'，那 CSP 就等于没有。三种取值：system（跟随系统）/ light / dark。
    -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
